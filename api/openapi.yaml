openapi: "3.0.0"
info:
  version: 1.0.0
  title: BazaarGo API
paths:
  /auth/register:
    post:
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/token:
    post:
      operationId: CreateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserToken'
      responses:
        '200':
          description: Token Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    post:
      operationId: CreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/products/{id}':
    put:
      operationId: UpdateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '204':
          description: Updated Sucessfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false



components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}
    CreateUserRequest:
      type: object
      required: [name, email, password,cpf]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password ,minLength: 8}
        cpf: {type: string, minLength: 11,maxLength: 11}
    UpdateUserRequest:
      type: object
      required: [id,name, email, cpf,password]
      properties:
        id: {type: integer}
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password ,minLength: 8}
        cpf: {type: string, minLength: 11,maxLength: 11}
    UserResponse:
      type: object
      required: [id,name,cpf,email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        cpf: {type: string, minLength: 11,maxLength: 11}
        email: { type: string }
    CreateUserToken:
      type: object
      required: [email,password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password ,minLength: 8}
    TokenResponse:
      type: object
      required: [token]
      properties:
        token: {type: string}
    CreateProductRequest:
      type: object
      required: [name,description,price,stock,category_id,specs]
      properties:
        name: {type: string}
        description: {type: string}
        price: {type: number}
        stock: {type: integer}
        category_id: {type: string}
        specs: {type: object, additionalProperties: true}
    UpdateProductRequest:
      type: object
      required: [name,description,price,stock,category_id,specs]
      properties:
        name: {type: string}
        description: {type: string}
        price: {type: number}
        stock: {type: integer}
        category_id: {type: string}
        specs: {type: object, additionalProperties: true}
    ProductResponse:
      type: object
      required: [name,description,price,stock,category_id,specs]
      properties:
        name: {type: string}
        description: {type: string}
        price: {type: number}
        stock: {type: integer}
        category_id: {type: string}
        specs: {type: object, additionalProperties: true}
