openapi: "3.0.0"
info:
  version: 1.0.0
  title: BazaarGo API
paths:
  /health:
    get:
      operationId: HealthCheck
      responses:
        '200':
          description: Healthy API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Not Healthy API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

      deprecated: false
  /auth/register:
    post:
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/token:
    post:
      operationId: CreateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserToken'
      responses:
        '200':
          description: Token Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    post:
      operationId: CreateProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/products/{id}':
    get:
      operationId: GetProductByID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-Client-ID
          in: header
          required: true
          schema: { type: string ,maxLength: 64}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: UpdateProduct
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '204':
          description: Updated Sucessfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '204':
          description: Deleted Successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: false
  /products/search/{name}:
    get:
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/recent:
    get:
      operationId: GetRecentProducts
      parameters:
        - name: X-Client-ID
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductResponse'
  /checkout:
    post:
      operationId: Checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, phone]
              properties:
                phone: { type: string }
                items:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, price, quantity]
                    properties:
                      name: { type: string ,maxLength: 100}
                      price: { type: number }
                      quantity: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  whatsapp_link: { type: string }
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {type: string}
    CreateUserRequest:
      type: object
      required: [name, email, password,cpf]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password ,minLength: 8}
        cpf: {type: string, minLength: 11,maxLength: 11}
    UpdateUserRequest:
      type: object
      required: [id,name, email, cpf,password]
      properties:
        id: {type: integer}
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password ,minLength: 8}
        cpf: {type: string, minLength: 11,maxLength: 11}
    UserResponse:
      type: object
      required: [id,name,cpf,email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        cpf: {type: string, minLength: 11,maxLength: 11}
        email: { type: string }
    CreateUserToken:
      type: object
      required: [email,password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password ,minLength: 8}
    TokenResponse:
      type: object
      required: [token]
      properties:
        token: {type: string}
    CreateProductRequest:
      type: object
      required: [name,description,price,stock,category_id,specs]
      properties:
        name: {type: string}
        description: {type: string}
        price: {type: number}
        stock: {type: integer}
        category_id: {type: string}
        specs: {type: object, additionalProperties: true}
    UpdateProductRequest:
      type: object
      required: [name,description,price,stock,category_id,specs]
      properties:
        name: {type: string}
        description: {type: string}
        price: {type: number}
        stock: {type: integer}
        category_id: {type: string}
        specs: {type: object, additionalProperties: true}
    ProductResponse:
      type: object
      required: [id,name,description,price,stock,category_id,specs]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        price: {type: number}
        stock: {type: integer}
        category_id: {type: string}
        specs: {type: object, additionalProperties: true}
    ListProductResponse:
      type: array
      items: {$ref:"#/components/schemas/ProductResponse"}
    HealthResponse:
      type: object
      required: [postgres_health,mongo_health,valkey_health]
      properties:
        postgres_health: {type: boolean}
        mongo_health: {type: boolean}
        valkey_health: {type: boolean}
