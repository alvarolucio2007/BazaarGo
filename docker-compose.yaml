services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: bazaar-pg-db
    environment:
      POSTGRES_DB: bazaargo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bazaargo"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:4
    env_file:
      - .env
    volumes:
      - ./database/migrations:/migrations:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /migrate -path=/migrations -database "$DATABASE_URL" up
    depends_on:
      db:
        condition: service_healthy

  cache:
    image: valkey/valkey:9-alpine
    container_name: bazaar-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:9
    container_name: bazaar-mg-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: bazaargo
    volumes:
      - mongo-data:/data/db:z
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: bazaar-otel-lgtm
    environment:
      - ENABLE_LOGS_LOKI=true
    ports:
      - "4317:4317"   # OTLP gRPC (Go will send the data here)
      - "4318:4318"   # OTLP HTTP
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telemetry.rule=Host(`telemetry.localhost`)"
      - "traefik.http.services.telemetry.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 256m

  traefik:
    image: traefik:v3.6
    container_name: bazaar-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  api:
    build: .
    container_name: bazaar-api
    environment:
      - DATABASE_URL=postgresql://admin:root@db:5432/bazaargo?sslmode=disable
      - MONGO_URL=mongodb://admin:admin123@mongo:27017/bazaargo?authSource=admin
      - CACHE_URL=cache:6379
      - OTEL_ENDPOINT=otel-lgtm:4317
      - OTEL_LOGGER_ENDPOINT=otel-lgtm:4318
      - PYROSCOPE_URL=http://otel-lgtm:4040
      - SERVER_ADDR=0.0.0.0:8080
      - MONGO_DB_NAME=bazaargo
      - MONGO_COLL_NAME=products
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s
  chat:
    build:
      context: .
      dockerfile: ./internal/chatbot/Dockerfile
    container_name: bazaar-chat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:root@db:5432/bazaargo?sslmode=disable
      - OTEL_ENDPOINT=otel-lgtm:4317
      - OTEL_LOGGER=otel-lgtm:4318
      - SERVER_ADDR=0.0.0.0:9090
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chat.localhost`)"
      - "traefik.http.services.chat.loadbalancer.server.port=9090"
    depends_on:
      db:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/health"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s
  admin-panel:
    build:
      context: .
      dockerfile: front/admin/Dockerfile
    container_name: bazaar-admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.localhost`)"
      - "traefik.http.services.admin.loadbalancer.server.port=8501"
    environment:
      - API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: front/vitrine/Dockerfile
    container_name: bazaar-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=Host(`front.localhost`)"
      - "traefik.http.services.front.loadbalancer.server.port=8501"
    environment:
      - API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
volumes:
  db-data:
  mongo-data:
