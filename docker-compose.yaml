services:
  db:
    image: postgres:18-alpine
    container_name: bazaar-pg-db
    environment:
      POSTGRES_DB: bazaargo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bazaargo"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:4
    env_file:
      - .env
    volumes:
      - ./database/migrations:/migrations:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /migrate -path=/migrations -database "$DATABASE_URL" up
    depends_on:
      db:
        condition: service_healthy

  cache:
    image: valkey/valkey:9-alpine
    container_name: bazaar-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:9
    container_name: bazaar-mg-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: bazaargo
    volumes:
      - mongo-data:/data/db:z
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: bazaar-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: meu_usuario
      ME_CONFIG_BASICAUTH_PASSWORD: minha_senha
    depends_on:
      mongo:
        condition: service_healthy
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: bazaar-otel-lgtm
    environment:
      - ENABLE_LOGS_LOKI=true
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC (Go will send the data here)
      - "4318:4318"   # OTLP HTTP
  traefik:
    image: traefik:v3.6
    container_name: bazaar-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"      # Porta do Tráfego
      - "8080:8080"  # Dashboard do Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  api:
    build: .
    container_name: bazaar-api
    environment:
      - DATABASE_URL=postgresql://admin:root@db:5432/bazaargo?sslmode=disable
      - MONGO_URL=mongodb://admin:admin123@mongo:27017/bazaargo?authSource=admin
      - CACHE_URL=cache:6379
      - OTEL_ENDPOINT=otel-lgtm:4317
      - OTEL_LOGGER_ENDPOINT=otel-lgtm:4318
      - PYROSCOPE_URL=http://otel-lgtm:4040
      - SERVER_ADDR=0.0.0.0:8080
      - MONGO_DB_NAME=bazaargo
      - MONGO_COLL_NAME=products
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      cache:
        condition: service_healthy
volumes:
  db-data:
  mongo-data:
