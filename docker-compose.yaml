services:
  db:
    image: postgres:18-alpine
    container_name: bazaar-pg-db
    environment:
      POSTGRES_DB: bazaargo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bazaargo"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:4
    env_file:
      - .env
    volumes:
      - ./database/migrations:/migrations:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /migrate -path=/migrations -database "$DATABASE_URL" up
    depends_on:
      db:
        condition: service_healthy

  cache:
    image: valkey/valkey:9-alpine
    container_name: bazaar-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:9
    container_name: bazaar-mg-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: bazaargo
    volumes:
      - mongo-data:/data/db:z
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: bazaar-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: meu_usuario
      ME_CONFIG_BASICAUTH_PASSWORD: minha_senha
    depends_on:
      mongo:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: bazaar-jaeger
    ports:
      - "16686:16686" # Jaeger web interface
      - "4317:4317"   # OTLP gRPC (Go will send traces here)
      - "4318:4318"   # OTLP HTTP (Backup)

volumes:
  db-data:
  mongo-data:
